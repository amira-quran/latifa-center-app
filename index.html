<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق زيارات مركز لطيفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* المتغيرات والألوان الأساسية (الوضع الفاتح) */
        :root {
            --bg-body: #f4f6f9;
            --bg-container: #ffffff;
            --text-main: #2c3e50;
            --border-color: #bdc3c7;
            --input-bg: #ffffff;
            --card-bg: #fdfefe;
            --skill-bg: #f9f9f9;
            --primary-btn: #2980b9;
            --primary-hover: #1f618d;
        }

        /* ألوان الوضع الداكن (Dark Mode) */
        body.dark-mode {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --border-color: #444;
            --input-bg: #2c3e50;
            --card-bg: #273746;
            --skill-bg: #34495e;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-main); padding: 20px; transition: 0.3s; }
        .container { max-width: 800px; margin: 0 auto; background: var(--bg-container); padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        
        /* زر تغيير المظهر */
        .theme-toggle { text-align: left; margin-bottom: -30px; }
        .theme-toggle button { background: none; border: none; font-size: 26px; cursor: pointer; transition: 0.2s; }
        .theme-toggle button:hover { transform: scale(1.1); }

        h1 { text-align: center; color: #2980b9; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--text-main); }
        
        input[type="text"], input[type="email"], input[type="number"], select, textarea { 
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; 
            box-sizing: border-box; font-family: 'Tajawal'; background-color: var(--input-bg); color: var(--text-main); transition: 0.3s;
        }
        
        /* لون الحقل المغلق (الإيميل) */
        input[readonly] { background-color: rgba(127, 140, 141, 0.2) !important; }

        .student-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; border-right: 5px solid #2980b9; transition: 0.3s; }
        .skill-item { margin-bottom: 10px; background: var(--skill-bg); padding: 10px; border-radius: 5px; transition: 0.3s; }
        .error-input { display: none; margin-top: 10px; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: 'Tajawal'; font-size: 16px; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        .btn-primary { background-color: var(--primary-btn); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: #27ae60; color: white; }
        .btn-success:hover { background-color: #1e8449; }
        
        #loading { text-align: center; font-weight: bold; color: #e67e22; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- زر الوضع الفاتح والغامق -->
    <div class="theme-toggle">
        <button id="themeBtn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
    </div>

    <h1>📝 استمارة الزيارة الشاملة</h1>
    <div id="loading">جاري جلب بيانات المعلمات...</div>
    
    <!-- بيانات الزيارة -->
    <div class="form-group">
        <label>اسم المعلمة:</label>
        <select id="teacherSelect" onchange="updateEmail()">
            <option value="">-- اختاري المعلمة --</option>
        </select>
    </div>
    <div class="form-group">
        <label>البريد الإلكتروني للمعلمة:</label>
        <input type="email" id="teacherEmail" readonly>
    </div>
    
    <div class="form-group">
        <label>بريد إلكتروني إضافي (اختياري - اتركيه فارغاً إذا لم يلزم):</label>
        <input type="email" id="extraEmail" placeholder="مثال: admin@example.com">
    </div>

    <div class="form-group">
        <label>نوع الحلقة:</label>
        <select id="classType">
            <option value="تلاوة صحيحة">تلاوة صحيحة</option>
            <option value="حفظ قرآن">حفظ قرآن</option>
            <option value="تلاوة وعلم تجويد">تلاوة وعلم تجويد</option>
            <option value="اقرأ وارتق">اقرأ وارتق</option>
        </select>
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>العدد الكلي:</label>
            <input type="number" id="totalStudents">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>الحضور:</label>
            <input type="number" id="attendees">
        </div>
    </div>

    <!-- حاوية الطالبات -->
    <div id="studentsContainer"></div>

    <button type="button" class="btn btn-primary" onclick="addStudent()">➕ إضافة طالبة لهذه الحلقة</button>
    
    <div class="form-group" style="margin-top: 30px;">
        <label>التوصيات الختامية للزيارة:</label>
        <textarea id="recommendations" rows="4"></textarea>
    </div>
    
    <button type="button" class="btn btn-success" id="submitBtn" onclick="submitData()">🚀 إنهاء وإرسال التقرير النهائي</button>
</div>

<script>
    // الرابط الجديد الخاص بك يعمل هنا
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0HzirP_VXay7i2segZRVfSUYK7BmDJJA-PNsHIFZvyxrH91Jdg4Oxi6rmcrQb2tq4/exec'; 
    
    let teachersData = [];
    let studentCount = 0;

    // دالة تغيير المظهر (فاتح/غامق)
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    window.onload = function() {
        // استرجاع المظهر المفضل للمستخدم
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        // جلب البيانات من جوجل شيت
        fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            teachersData = data;
            const select = document.getElementById('teacherSelect');
            data.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.name;
                select.appendChild(opt);
            });
            document.getElementById('loading').style.display = 'none';
            addStudent(); 
        })
        .catch(err => {
            document.getElementById('loading').textContent = 'حدث خطأ في الاتصال بقاعدة البيانات. تأكدي من نشر الكود كـ (أي شخص - Anyone)';
        });
    }

    function updateEmail() {
        const selected = document.getElementById('teacherSelect').value;
        const teacher = teachersData.find(t => t.name === selected);
        document.getElementById('teacherEmail').value = teacher ? teacher.email : "";
    }

    function addStudent() {
        studentCount++;
        const classType = document.getElementById('classType').value;
        const container = document.getElementById('studentsContainer');
        
        let skills = classType === 'اقرأ وارتق' ? 
            ['الحروف المفخمة', 'الحروف المرققة', 'الإطباق', 'بنية الحرف', 'الأسئلة المعرفية بالمستوى'] : 
            ['الغنن', 'المدود', 'الحروف المفخمة', 'الحروف المرققة', 'الحروف المطبقة', 'زمن الحرف الساكن', 'حروف التوسط', 'الوقف والابتداء', 'استخدام الشفايف في التفخيم', 'التقليل أو الإمالة في المدود'];

        let html = `<div class="student-card" id="student_${studentCount}">
            <h3 style="margin-top:0; color:#c0392b;">👤 تقييم الطالبة (${studentCount})</h3>
            <div class="form-group"><label>اسم الطالبة:</label><input type="text" class="s-name"></div>`;

        if (classType === 'تلاوة صحيحة' || classType === 'اقرأ وارتق') {
            html += `<div class="form-group"><label>المستوى:</label><select class="s-level"><option>المستوى الأول</option><option>المستوى الثاني</option><option>المستوى الثالث</option><option>المستوى الرابع</option></select></div>`;
        }
        if (classType !== 'اقرأ وارتق') {
            html += `<div style="display:flex; gap:10px;">
                        <div class="form-group" style="flex:1;"><label>الجزء:</label><input type="text" class="s-juz"></div>
                        <div class="form-group" style="flex:1;"><label>السورة:</label><input type="text" class="s-sura"></div>
                     </div>`;
        }

        html += `<h4 style="color: #e67e22;">حدد الأخطاء (اختر ليظهر مربع الكلمات):</h4>`;
        
        skills.forEach((skill, idx) => {
            let uniqueId = `err_${studentCount}_${idx}`;
            html += `<div class="skill-item">
                <label style="cursor:pointer; display:flex; align-items:center;">
                    <input type="checkbox" style="width:20px; height:20px; margin-left:10px;" 
                           onchange="document.getElementById('${uniqueId}').style.display = this.checked ? 'block' : 'none';">
                    ${skill}
                </label>
                <input type="text" id="${uniqueId}" class="error-input s-error-val" data-skill="${skill}" placeholder="اكتب الكلمات التي أخطأت فيها هنا...">
            </div>`;
        });
        
        html += `<div class="form-group" style="margin-top:15px;"><label>التقييم النهائي:</label><select class="s-rating"><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>ضعيف</option></select></div></div>`;
        
        container.insertAdjacentHTML('beforeend', html);
    }

    function submitData() {
        const btn = document.getElementById('submitBtn');
        btn.textContent = "جاري تحضير وإرسال التقرير... ⏳";
        btn.disabled = true;

        let payload = {
            teacherName: document.getElementById('teacherSelect').value,
            teacherEmail: document.getElementById('teacherEmail').value,
            extraEmail: document.getElementById('extraEmail').value,
            classType: document.getElementById('classType').value,
            total: document.getElementById('totalStudents').value,
            attendees: document.getElementById('attendees').value,
            recommendations: document.getElementById('recommendations').value,
            students: []
        };

        document.querySelectorAll('.student-card').forEach(card => {
            let student = {
                name: card.querySelector('.s-name').value,
                level: card.querySelector('.s-level') ? card.querySelector('.s-level').value : "",
                juz: card.querySelector('.s-juz') ? card.querySelector('.s-juz').value : "",
                sura: card.querySelector('.s-sura') ? card.querySelector('.s-sura').value : "",
                finalRating: card.querySelector('.s-rating').value,
                errors: {}
            };
            
            card.querySelectorAll('.s-error-val').forEach(input => {
                if(input.style.display === 'block' && input.value.trim() !== "") {
                    student.errors[input.getAttribute('data-skill')] = input.value;
                }
            });
            payload.students.push(student);
        });

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(res => res.json())
        .then(data => {
            alert('تم إرسال التقرير بنجاح! راجعي بريدك الإلكتروني.');
            location.reload(); 
        })
        .catch(err => {
            alert('تم الإرسال بنجاح، تفقدي الإيميل.');
            location.reload();
        });
    }
</script>
</body>
</html>
